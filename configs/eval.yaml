# Phase 3 evaluation settings (src/eval/evaluate.py, src/eval/speed.py, src/eval/aggregate.py).

# Test sets: ID -> image list (labels are found by swapping the last "images" folder for "labels").
# Every model, including the road-crop models, is scored against the FULL-frame labels:
# a crop model sees only the bottom part of each frame and potholes above it count as misses.
testsets:
  A: data/processed/splits/rdd_test.txt     # RDD2022 test, clear
  B1: data/processed/splits/B1.txt          # A + synthetic drizzle
  B2: data/processed/splits/B2.txt          # A + synthetic heavy rain
  B3: data/processed/splits/B3.txt          # A + synthetic torrential rain
  C: data/processed/splits/C.txt            # MWPD, normal weather (domain shift)
  D: data/processed/splits/D_full.txt       # MWPD, real rain
val_list: data/processed/splits/rdd_val.txt # only used to fix each run's confidence threshold
fp16_testsets: [A]                          # also scored with FP16 weights (reduced-precision lever)

predict:
  conf: 0.001        # keep low-confidence boxes for mAP (Ultralytics validation default)
  iou: 0.7           # NMS IoU (ignored by NMS-free YOLO26 heads)
  max_det: 300
  batch: 16

speed:
  testset: A         # images used for timing (the first `images` of the list)
  images: 300        # timed predictions (batch 1)
  warmup: 50
  cpu_images: 100    # CPU is ~50x slower; fewer timed images keeps the run short
  cpu_warmup: 10
  conf: 0.25         # deployment-like threshold (NMS time of YOLOv8 depends on it)
  devices:           # (device, precision) pairs
    - [gpu, fp32]
    - [gpu, fp16]
    - [cpu, fp32]

# Example figures (src/eval/visualize.py). Images come from the RDD val list; every tile is the
# 640x640 square letterboxed network input. Boxes use each run's val-fixed confidence threshold.
visualize:
  n_images: 6          # one image per country, chosen with `seed` (or list `stems` explicitly)
  seed: 42
  stems: []            # e.g. [Japan_012345, India_001234]
  iou_match: 0.5       # TP/FP/FN colouring: green = TP, red = FP, yellow = FN (missed)
  layer_configs: [yolov8n_rdd_640, yolo26n_rdd_640, yolo26n-p2_rdd_640, yolo26n_crop60_640]
  layer_images: 2      # per-layer figures for the first N sample images

# Reference configuration for "n.s." marks and relative numbers (run_id without the seed).
anchor: yolo26n_rdd_640
# Results / tables / figures
paths:
  preds: outputs/eval/preds
  results: outputs/results/results.csv
  speed: outputs/results/speed.csv
  tables: outputs/tables
  figures: outputs/figures

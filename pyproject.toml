[project]
name = "pothole-rain"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "ANN"]
ignore = ["D203", "D213", "ANN401", "N812"]  # N812: `import albumentations as A` is the library convention

[tool.ruff.lint.pydocstyle]
convention = "google"
